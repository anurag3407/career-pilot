# =============================================================================
# CareerPilot AI & D1 Gateway — Cloudflare Worker
# =============================================================================
# Single gateway for CareerPilot: Cloudflare D1 (database + auth), Workers AI,
# BYOK passthrough, RapidAPI job search proxy, and ImageKit uploads.
#
# Deploy (free tier: 100k requests/day):
#   cd worker && npx wrangler login && npx wrangler deploy
#
# Secrets (set once — never commit):
#   npx wrangler secret put AUTH_SECRET
#   npx wrangler secret put CLOUDFLARE_API_TOKEN
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put RAPIDAPI_KEY
#   npx wrangler secret put IMAGEKIT_PRIVATE_KEY
# =============================================================================

name = "careerpilot-gateway"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "careerpilot-db"
database_id = "54d97544-d09e-422a-aa17-1be24891f076"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "*"
DEFAULT_AI_PROVIDER = "cloudflare"
CLOUDFLARE_ACCOUNT_ID = "74d877492e541ba6d459990fff4fad12"
IMAGEKIT_PUBLIC_KEY = "public_HbKrLXFCb5VWNjz7jBfAteEOhBM="
IMAGEKIT_URL_ENDPOINT = "https://ik.imagekit.io/anurag3407"
