name: Backend CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ./backend/package-lock.json
            ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # portfolioHtmlGenerator tests read the pre-built standalone bundle, so
      # build it before testing — otherwise they fail on a missing dist-portfolio.
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build portfolio bundle
        working-directory: ./frontend
        run: npm run build:portfolio

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
