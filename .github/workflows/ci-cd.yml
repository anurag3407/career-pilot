name: CI/CD

# One pipeline: every PR and push to main runs the three CI jobs; only a green
# run on main reaches the deploy job (Pages + Worker + D1 migrations).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production after CI (main only)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that may be deploying main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build SPA and portfolio bundle
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_AI_GATEWAY_URL: /gateway/v1
        run: npm run build

      - name: Upload SPA build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
          if-no-files-found: error

      # Only the files portfolioHtmlGenerator reads: standalone.html + assets/.
      # Keeps the backend artifact small (the full bundle embeds ~73 MB of previews).
      - name: Upload portfolio shell
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-shell
          path: |
            frontend/dist-portfolio/standalone.html
            frontend/dist-portfolio/assets/**
          retention-days: 3
          if-no-files-found: error

  backend:
    name: backend
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # portfolioHtmlGenerator tests read frontend/dist-portfolio; reuse the
      # frontend job's build instead of rebuilding it here.
      - name: Restore portfolio shell
        uses: actions/download-artifact@v4
        with:
          name: portfolio-shell
          path: frontend/dist-portfolio

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    name: deploy
    needs: [frontend, backend, worker]
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Download SPA build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Worker dependencies
        working-directory: ./worker
        run: npm ci

      # Runs before the Worker so the schema exists for the new code. Wrangler
      # skips its confirmation prompt in CI and backs up D1 first.
      - name: Apply D1 migrations
        working-directory: ./worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        working-directory: ./worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Reuse the wrangler pinned in worker/package-lock.json instead of the
      # ad-hoc `npx wrangler` download the old workflow used.
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: '1'
        run: |
          worker/node_modules/.bin/wrangler pages deploy frontend/dist \
            --project-name=careerpilot \
            --branch=main \
            --commit-dirty=true

      - name: Verify deployment
        env:
          PAGES_URL: ${{ vars.PAGES_URL || 'https://careerpilot-20i.pages.dev' }}
          WORKER_URL: ${{ vars.WORKER_URL || 'https://careerpilot-gateway.anuragmishra3407.workers.dev' }}
        run: node scripts/verify-deploy.mjs

      # The /gateway/v1 proxy lives outside this repo (Worker route on the
      # custom domain or a Pages proxy), so a miss here is a warning, not a
      # failed deploy.
      - name: Check /gateway/v1 proxy (non-blocking)
        if: always() && vars.PUBLIC_SITE_URL != ''
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          if ! curl -fsS --max-time 20 "$PUBLIC_SITE_URL/gateway/v1/health"; then
            echo "::warning::/gateway/v1 is not reachable on $PUBLIC_SITE_URL. Verify the Worker route or Pages proxy configured outside the repo."
          fi

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Pages | ${{ vars.PAGES_URL || 'https://careerpilot-20i.pages.dev' }} |"
            echo "| Worker | ${{ vars.WORKER_URL || 'https://careerpilot-gateway.anuragmishra3407.workers.dev' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
